plugins { id 'com.android.application' }

android {
    namespace 'ru.awaymode.app'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'ru.awaymode.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.2.8'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('AWAYMODE_KEYSTORE_PATH') ?: 'missing-keystore.p12')
            storeType 'PKCS12'
            storePassword System.getenv('AWAYMODE_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('AWAYMODE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('AWAYMODE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
